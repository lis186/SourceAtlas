name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - feature/skill-slim

permissions:
  contents: read

jobs:
  lint-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: tests/tools/lint-frontmatter.sh
