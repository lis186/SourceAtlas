# Zone Report Template
# Generated by /atlas.seam
# Machine-readable output for composability with /atlas.audit

file: "{file_path}"
language: "{language}"
total_lines: 0
zone_count: 0
analysis_date: "{iso_date}"

# Zones ranked by refactoring priority (highest first)
zones:
  - id: "{zone_id}"
    name: "{zone_name}"
    lines: [0, 0]
    line_count: 0
    method_count: 0

    # Responsibility clustering (from clang AST sends)
    responsibility: "{description}"
    external_collaborators:
      - "{ClassName}"

    # Seam analysis (Feathers taxonomy)
    seams:
      - type: "object|link|preprocessing"
        signal: "{what indicates this seam exists}"
        enabling_point: "{where behavior is selected}"
        leverage: "high|medium|low"

    # Code smell detection (Fowler)
    smells:
      - type: "feature_envy|divergent_change|shotgun_surgery"
        evidence: "{file:line reference}"

    # Refactoring priority
    priority_score: 0  # method_count × unique_deps × (1 + smell_count)
    deps: []

# Recommendation
recommendation:
  zone_id: "{highest_priority_zone}"
  reason: "{why start here}"
  audit_command: "/atlas.audit {file_path} --lines {start}-{end}"
