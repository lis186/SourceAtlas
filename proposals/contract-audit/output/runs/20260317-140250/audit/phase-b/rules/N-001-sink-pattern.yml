id: N-001-sink-pattern
message: "N-001: Combine sink subscription pattern -- .finished branch behavior must be preserved or fixed"
severity: error
language: Swift
rule:
  all:
    - kind: call_expression
    - has:
        regex: "\\.sink"
    - has:
        regex: "receiveValue"
note: |
  Contract source: PaymentsNetworkManager.swift:40-49
  CRITICAL: .finished branch does not call completion -- silent failure risk.
  Seam_Type: link (callback handoff crosses boundary to caller).
  Refactoring requirement: if migrating to async/await, ensure all paths return a result.
