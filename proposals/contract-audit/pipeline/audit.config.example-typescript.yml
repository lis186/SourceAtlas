# audit.config.example-typescript.yml
# 合約審計配置範例 — TypeScript（AuthService）
#
# 使用方式：
#   cp audit.config.example-typescript.yml audit.config.yml
#   # 修改 target_files 為實際路徑
#   bash pipeline/run-baseline.sh

module: AuthService
language: typescript

target_files:
  - src/services/auth/AuthService.ts
  - src/services/auth/TokenManager.ts
  - src/services/auth/AuthMiddleware.ts
  - src/types/auth.d.ts

refactoring_intent: "Migrate from class-based to functional React hooks, replace axios with fetch API"

boundary_discovery:
  # 觀察者模式：EventEmitter、addEventListener、RxJS Subject、自訂 on() 回呼
  observer_patterns: 'EventEmitter|addEventListener\s*\(|\.subscribe\s*\(|new\s+Subject|\.on\s*\(|\.emit\s*\('
  # 同步原語：Promise、async/await、Web Worker、Mutex（async-mutex 套件）
  sync_patterns: "new\\s+Promise|async\\s+function|await\\s+|new\\s+Worker|Mutex|Semaphore|navigator\\.locks"
  file_types:
    - ts
    - js
  max_files: 5

verification:
  # TypeScript 完整支援 ast-grep，可進行結構化匹配
  primary: ast-grep
  # grep 作為輔助，捕捉 ast-grep 規則未覆蓋的字串模式
  secondary: none

dependency_analysis:
  # TypeScript import 模式：ES module import、require、dynamic import
  import_patterns: 'import\s+\{.*\}\s+from\s+|import\s+.*\s+from\s+|require\s*\(|import\s*\('
  seam_detection: true
  # AuthService 為核心認證模組，多處依賴，設較低閾值
  pinch_point_threshold: 3
